services:
  basebuddy:
    # Published multi-platform image (linux/amd64 and linux/arm64).
    # To build from source instead, add compose.build.yaml:
    #   docker compose -f compose.yaml -f compose.build.yaml up -d --build
    image: ${BASEBUDDY_IMAGE:-ghcr.io/stack127labs/basebuddy:0.2.2}
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BASEBUDDY_PORT:-8080}:8080"
    volumes:
      - basebuddy-data:/app/basebuddy-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  basebuddy-data:
