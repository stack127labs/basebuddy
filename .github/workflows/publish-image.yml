name: Publish Docker image
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.2.2
        required: true
permissions:
  contents: read
concurrency:
  group: publish-image-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/stack127labs/basebuddy
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  build:
    # Only the public distribution repository publishes the public image.
    if: github.repository == 'stack127labs/basebuddy'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${RELEASE_TAG}" || { echo "Tag ${RELEASE_TAG} does not match package.json version ${version}." >&2; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: BASEBUDDY_VERSION=${{ env.VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Check the pushed image starts
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="${IMAGE}@${DIGEST}"
          docker pull --platform "${{ matrix.platform }}" "$ref"
          docker run --detach --name basebuddy-check --platform "${{ matrix.platform }}" \
            -e BASEBUDDY_AUTH_SECRET="$(openssl rand -hex 32)" -e BASEBUDDY_SITE_INDEXABLE=false \
            -p 127.0.0.1:8080:8080 "$ref"
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/onboarding
          test "$(docker exec basebuddy-check id -u)" = "10001"
          docker exec basebuddy-check pnpm basebuddy --help >/dev/null
          docker rm --force basebuddy-check
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
      - name: Publish the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Show the published image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
