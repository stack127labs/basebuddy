name: App checks
on:
  pull_request:
  push:
    branches: [main, self-host-dev]
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: basebuddy-ci-test
          POSTGRES_DB: basebuddy_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test --maxWorkers=2
      - run: pnpm exec vitest run src/test/postgres-release.integration.test.ts
        env:
          BASEBUDDY_TEST_DATABASE_URL: postgresql://postgres:basebuddy-ci-test@127.0.0.1:5432/basebuddy_test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: docker build -t basebuddy:ci .
      - run: node scripts/smoke-docker.mjs basebuddy:ci
      - run: node scripts/export-public-release.mjs /tmp/basebuddy-public-release
        if: github.repository == 'stack127labs/basebuddy-website'
  website:
    if: github.repository == 'stack127labs/basebuddy-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --dir website typecheck
      - run: pnpm --dir website test
      - run: pnpm --dir website build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: docker build -f Dockerfile.website -t basebuddy-website:ci .
