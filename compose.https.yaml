services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BASEBUDDY_DOMAIN: ${BASEBUDDY_DOMAIN:?Set BASEBUDDY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
